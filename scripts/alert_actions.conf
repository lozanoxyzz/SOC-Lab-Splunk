# /opt/splunk/etc/system/local/alert_actions.conf
# Registers block_ip.sh as a custom alert action in Splunk

[block_ip]
is_custom = 1
label = Block IP in pfSense
description = Adds the source IPs of the alert to the BLOCKED_IPS table on pfSense via SSH
icon_path = alert.png
payload_format = json
command = $SPLUNK_HOME/bin/scripts/block_ip.sh
